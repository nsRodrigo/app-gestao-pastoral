name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 22

jobs:
  test-api:
    name: API (lint, typecheck, testes, build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestao_pastoral_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestao_pastoral_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-min-16-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-min-16-chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 30
      CORS_ORIGIN: http://localhost:3000
      SESSION_INACTIVITY_MINUTES: 30
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build do pacote compartilhado
        run: pnpm --filter @gestao-pastoral/shared build

      - name: Gerar Prisma Client
        run: pnpm --filter @gestao-pastoral/api prisma:generate

      - name: Lint (shared + api)
        run: |
          pnpm --filter @gestao-pastoral/shared lint
          pnpm --filter @gestao-pastoral/api lint

      - name: Typecheck (shared + api)
        run: |
          pnpm --filter @gestao-pastoral/shared typecheck
          pnpm --filter @gestao-pastoral/api typecheck

      - name: Aplicar migrations no banco de teste
        run: pnpm --filter @gestao-pastoral/api prisma:deploy

      - name: Testes unitários (shared + api)
        run: |
          pnpm --filter @gestao-pastoral/shared test
          pnpm --filter @gestao-pastoral/api test

      - name: Testes de integração/E2E (api)
        run: pnpm --filter @gestao-pastoral/api test:e2e

      - name: Build (api)
        run: pnpm --filter @gestao-pastoral/api build

  test-web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest

    env:
      API_URL: http://localhost:3001/api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build do pacote compartilhado
        run: pnpm --filter @gestao-pastoral/shared build

      - name: Lint (web)
        run: pnpm --filter @gestao-pastoral/web lint

      - name: Typecheck (web)
        run: pnpm --filter @gestao-pastoral/web typecheck

      - name: Build (web)
        run: pnpm --filter @gestao-pastoral/web build
